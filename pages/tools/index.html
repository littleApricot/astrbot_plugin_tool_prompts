<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工具说明编辑</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6fa;--panel:#fff;--fg:#202837;--muted:#637084;--line:#dbe1eb;--accent:#3b5ccc;--soft:#eef1ff;--error:#b02e35;--success:#287348}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:1440px;margin:auto;padding:28px}h1{font-size:26px;margin:0}h2{font-size:21px;margin:0;overflow-wrap:anywhere}h3{font-size:17px;margin:24px 0 12px}p{margin:8px 0}.muted,small{color:var(--muted)}small{display:block;font-size:13px}button,input,select,textarea{font:inherit;color:inherit}button,input,select{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel)}button{cursor:pointer}button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #7b9bff;outline-offset:2px}textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:12px;resize:vertical;min-height:92px;line-height:1.65}input[type=search]{min-width:190px;flex:1}header>button{flex-shrink:0;white-space:nowrap}header{display:flex;justify-content:space-between;gap:12px;align-items:center}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 10px;align-items:center}.filters label{display:flex;align-items:center;gap:5px}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:20px;margin-top:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}.sidebar{padding:8px;height:calc(100vh - 255px);min-height:340px;max-height:820px;overflow:auto}.tool{display:block;width:100%;border-color:transparent;text-align:left;margin:3px 0;padding:12px;overflow-wrap:anywhere}.tool[aria-current=true]{background:var(--soft);border-color:var(--accent)}.tool strong{display:block;font-size:14px}.tool small{margin-top:3px}.editor{padding:24px;min-width:0}.editor-head{display:flex;gap:12px;justify-content:space-between;align-items:start}.badge{font-size:12px;white-space:nowrap;border:1px solid var(--line);border-radius:15px;padding:2px 9px;color:var(--muted)}.badge.custom{background:var(--soft);color:var(--accent)}.field{margin-top:20px}.field>label{display:block;font-weight:600;margin-bottom:7px}.param{border-top:1px solid var(--line);padding:16px 0}.param-label{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:7px}.param-label label{font-weight:600;overflow-wrap:anywhere}.param small{margin:5px 0}.param textarea{min-height:80px}details{margin-top:10px;color:var(--muted)}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 ui-monospace,SFMono-Regular,monospace;background:var(--bg);padding:14px;border-radius:8px;max-height:350px;overflow:auto}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0;margin-top:12px;position:sticky;top:0;z-index:2;background:var(--panel)}.empty{padding:45px 15px;text-align:center;color:var(--muted)}#status{min-height:24px;white-space:pre-wrap;overflow-wrap:anywhere}#status[data-error=true]{color:var(--error)}#status[data-success=true]{color:var(--success)}#count{font-size:13px;color:var(--muted)}#stale{color:var(--error)}[hidden]{display:none!important}
@media(prefers-color-scheme:dark){:root{--bg:#141820;--panel:#1d2430;--fg:#e2e8f2;--muted:#a5b0c2;--line:#374355;--accent:#9bb2ff;--soft:#293755;--error:#ff9ba1;--success:#8ee0ac}button.primary{color:#121c36}}
@media(max-width:760px){main{padding:16px}.layout{grid-template-columns:minmax(0,1fr)}.sidebar{height:235px;min-height:0}.editor{padding:18px}header{align-items:start}h1{font-size:23px}.filters{gap:8px}select{max-width:100%;min-width:0}input[type=search]{width:100%}.editor-head{flex-wrap:wrap}.actions{padding-bottom:10px}}
</style>
</head>
<body><main>
<header><div><h1>工具说明编辑</h1><p class="muted">调整模型如何理解、选择和调用每个工具。</p></div><button id="refresh" type="button">刷新列表</button></header>
<p class="muted">保存后，后续模型请求使用新说明。列出的是已注册工具，实际可用范围仍由原有开关、人格与权限决定。</p>
<div class="filters"><input id="search" type="search" placeholder="搜索工具、来源或说明" aria-label="搜索工具"><select id="source" aria-label="筛选来源"><option value="">全部来源</option></select><label><input id="custom-only" type="checkbox">只看已修改</label></div>
<div id="count"></div><div id="status" role="status" aria-live="polite">正在加载…</div>
<div class="layout"><nav id="list" class="panel sidebar" aria-label="工具列表"></nav><section class="panel editor" aria-label="工具说明编辑器">
<div id="empty" class="empty">从左侧选择一个工具</div>
<form id="editor" hidden>
<div class="editor-head"><div><h2 id="tool-name"></h2><small id="tool-source"></small></div><span id="tool-state" class="badge"></span></div>
<div class="actions"><button id="save" class="primary" type="submit" disabled>保存说明</button><button id="reset" type="button" disabled>恢复默认</button><span id="dirty" class="muted"></span></div>
<div class="field"><label for="description">工具说明</label><small>写清楚工具能做什么、适用场景、何时调用，以及需要注意的结果含义。</small><textarea id="description" rows="7" spellcheck="false"></textarea><details><summary>查看原始工具说明</summary><pre id="original-description"></pre></details></div>
<h3>参数说明</h3><small>填写方式可以调整；参数名称、类型、必填规则与可选值沿用工具定义。</small><div id="parameters"></div>
<p id="stale" hidden></p>
<details><summary>预览完整工具定义</summary><pre id="preview"></pre></details>
</form></section></div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),labels={plugin:'插件',mcp:'MCP',builtin:'内置',other:'其他'};
let data={tools:[],revision:0},selected=null,baseline='',busy=false;
const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;};
function notify(text,error=false,success=false){$('status').textContent=text;$('status').dataset.error=String(error);$('status').dataset.success=String(success);}
async function api(method,path,body){const bridge=window.AstrBotPluginPage;if(!bridge)throw Error('请从 AstrBot 插件页面入口打开此页');let response=method==='GET'?await bridge.apiGet(path):await bridge.apiPost(path,body);if(response.status==='error')throw Error(response.message||'操作失败');if((response.status==='ok'||response.status==='success')&&response.data)response=response.data;return response;}
function values(){const parameters={};for(const node of $('parameters').querySelectorAll('textarea'))parameters[node.dataset.path]=node.value;return {description:$('description').value,parameters};}
function isDirty(){return selected!==null&&JSON.stringify(values())!==baseline;}
function changed(){const dirty=isDirty();$('save').disabled=busy||!dirty;$('reset').disabled=busy||(!dirty&&!selected?.overridden);$('dirty').textContent=dirty?'有未保存的修改':'';if(selected){const schema=structuredClone(selected.parameter_schema);for(const [path,text] of Object.entries(values().parameters)){const parts=path===''?[]:path.slice(1).split('/').map(part=>part.replace(/~1/g,'/').replace(/~0/g,'~'));let node=schema;for(const part of parts)node=node[part];const original=selected.parameters.find(item=>item.path===path);if(text!==''||original.original_description!==''||Object.hasOwn(node,'description'))node.description=text;}$('preview').textContent=JSON.stringify({type:'function',function:{name:selected.name,description:$('description').value,parameters:schema}},null,2);}}
function visible(){const query=$('search').value.trim().toLocaleLowerCase(),source=$('source').value;return data.tools.filter(tool=>(!source||JSON.stringify([tool.source_kind,tool.source])===source)&&(!$('custom-only').checked||tool.overridden)&&(!query||[tool.name,tool.source,tool.source_display,tool.description].join('\n').toLocaleLowerCase().includes(query)));}
function renderList(){const tools=visible();$('count').textContent=`显示 ${tools.length} / ${data.tools.length} 个工具 · ${data.tools.filter(tool=>tool.overridden).length} 个有自定义说明`;$('list').replaceChildren();for(const tool of tools){const button=el('button');button.type='button';button.className='tool';button.setAttribute('aria-current',String(tool.id===selected?.id));button.append(el('strong',tool.name),el('small',`${labels[tool.source_kind]||tool.source_kind} · ${tool.source_display}${tool.overridden?' · 已修改':''}`));button.addEventListener('click',()=>{if(busy||tool.id===selected?.id)return;if(isDirty()&&!confirm('当前修改尚未保存，确定切换工具吗？'))return;edit(tool);renderList();});$('list').append(button);}if(!tools.length)$('list').append(el('div','没有匹配的工具','empty'));}
function edit(tool){selected=tool;$('empty').hidden=!!tool;$('editor').hidden=!tool;if(!tool)return;$('tool-name').textContent=tool.name;$('tool-source').textContent=`${labels[tool.source_kind]||tool.source_kind} · ${tool.source_display}`;$('tool-state').textContent=tool.source_kind==='builtin'?'按原配置启用':tool.active?'已启用':'已停用';$('tool-state').className='badge'+(tool.overridden?' custom':'');$('description').value=tool.description;$('original-description').textContent=tool.original_description||'（原始说明为空）';$('parameters').replaceChildren();for(const [index,param] of tool.parameters.entries()){const block=el('div',undefined,'param'),head=el('div',undefined,'param-label'),label=el('label',param.label);label.htmlFor='param-'+index;head.append(label,el('span',Array.isArray(param.type)?param.type.join(' / '):param.type,'badge'));if(param.required)head.append(el('span','必填','badge'));if(param.overridden)head.append(el('span','已修改','badge custom'));const textarea=el('textarea');textarea.id=label.htmlFor;textarea.dataset.path=param.path;textarea.value=param.description;textarea.rows=2;textarea.spellcheck=false;textarea.addEventListener('input',changed);block.append(head);if(param.enum)block.append(el('small','可选值：'+JSON.stringify(param.enum)));if(param.has_default)block.append(el('small','默认值：'+JSON.stringify(param.default_value)));block.append(textarea);const detail=el('details');detail.append(el('summary','查看原始参数说明'),el('pre',param.original_description||'（原始说明为空）'));block.append(detail);$('parameters').append(block);}if(!tool.parameters.length)$('parameters').append(el('p','这个工具没有参数说明','muted'));$('stale').hidden=!tool.stale_parameters.length;$('stale').textContent='工具更新后有 '+tool.stale_parameters.length+' 项旧参数说明已失效。再次保存会清理这些旧项。';baseline=JSON.stringify(values());changed();}
function accept(next,id){if(!Array.isArray(next.tools)||!Number.isInteger(next.revision))throw Error('工具列表格式无效');data=next;const oldSource=$('source').value;$('source').replaceChildren(new Option('全部来源',''));const sources=new Map(data.tools.map(tool=>[JSON.stringify([tool.source_kind,tool.source]),`${labels[tool.source_kind]||tool.source_kind} · ${tool.source_display}`]));for(const [value,label] of sources)$('source').append(new Option(label,value));if(sources.has(oldSource))$('source').value=oldSource;edit(data.tools.find(tool=>tool.id===id)||data.tools[0]||null);renderList();}
function loading(value){busy=value;$('refresh').disabled=value;for(const node of $('editor').querySelectorAll('textarea'))node.disabled=value;changed();}
async function load(){if(isDirty()&&!confirm('当前修改尚未保存，确定刷新列表吗？'))return;loading(true);notify('正在加载…');try{accept(await api('GET','tools'),selected?.id);notify('');}catch(error){notify(error.message,true);}finally{loading(false);}}
$('editor').addEventListener('submit',async event=>{event.preventDefault();if(busy||!selected||!isDirty())return;const id=selected.id;loading(true);notify('正在保存…');try{accept(await api('POST','save',{id,revision:data.revision,definition_digest:selected.definition_digest,...values()}),id);notify('已保存，后续模型请求将使用新说明。',false,true);}catch(error){notify(error.message,true);}finally{loading(false);}});
$('reset').addEventListener('click',async()=>{if(busy||!selected)return;const id=selected.id;loading(true);notify('正在恢复…');try{accept(await api('POST','reset',{id,revision:data.revision,definition_digest:selected.definition_digest}),id);notify('已恢复原始说明。',false,true);}catch(error){notify(error.message,true);}finally{loading(false);}});
$('description').addEventListener('input',changed);$('refresh').addEventListener('click',load);$('search').addEventListener('input',renderList);$('source').addEventListener('change',renderList);$('custom-only').addEventListener('change',renderList);window.addEventListener('beforeunload',event=>{if(isDirty()){event.preventDefault();event.returnValue='';}});load();
</script>
</body>
</html>
